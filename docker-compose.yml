version: '3.9'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-tradebase}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB:       ${POSTGRES_DB:-tradebase}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tradebase}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL:           postgresql://${POSTGRES_USER:-tradebase}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-tradebase}
      NEXTAUTH_SECRET:        ${NEXTAUTH_SECRET:-change-this-secret}
      NEXTAUTH_URL:           ${NEXTAUTH_URL:-http://localhost:3000}
      ANTHROPIC_API_KEY:      ${ANTHROPIC_API_KEY}
      TWILIO_ACCOUNT_SID:     ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN:      ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER:    ${TWILIO_PHONE_NUMBER}
      GOOGLE_MAPS_API_KEY:    ${GOOGLE_MAPS_API_KEY}
      ATTOM_API_KEY:          ${ATTOM_API_KEY}
    ports:
      - "3000:3000"

  # Database migration runner (one-shot)
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tradebase}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-tradebase}
    command: sh -c "npx prisma migrate deploy && npx tsx prisma/seed.ts"
    restart: "no"

volumes:
  postgres_data:

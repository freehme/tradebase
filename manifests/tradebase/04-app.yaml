---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tradebase
  namespace: tradebase
  labels:
    app: tradebase
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tradebase
  template:
    metadata:
      labels:
        app: tradebase
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -U tradebase; do
                echo "waiting for postgres..."
                sleep 2
              done
      containers:
        - name: tradebase
          image: tradebase:local
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: tradebase-secrets
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: tradebase
  namespace: tradebase
spec:
  selector:
    app: tradebase
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080
  type: NodePort

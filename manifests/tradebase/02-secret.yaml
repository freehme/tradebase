---
# Tradebase app secrets — generated by k3d-deploy.sh
# These values are for local development only.
apiVersion: v1
kind: Secret
metadata:
  name: tradebase-secrets
  namespace: tradebase
type: Opaque
stringData:
  DATABASE_URL: "postgresql://tradebase:tradebase_local@postgres:5432/tradebase"
  NEXTAUTH_SECRET: "local-dev-nextauth-secret-32chars!!"
  NEXTAUTH_URL: "http://localhost:3000"
  # Optional — leave blank if not available; AI features will be disabled
  ANTHROPIC_API_KEY: ""
  TWILIO_ACCOUNT_SID: ""
  TWILIO_AUTH_TOKEN: ""
  TWILIO_PHONE_NUMBER: ""
  GOOGLE_MAPS_API_KEY: ""
  ATTOM_API_KEY: ""

---
# =============================================================================
# OpenClaw — Self-Hosted AI Agent Platform (K3s Deployment)
# =============================================================================
# OpenClaw is an open-source AI agent runtime connecting Claude (and other
# models) to messaging, tools, and autonomous task execution.
#
# SETUP REQUIRED before applying:
#   kubectl create secret generic openclaw-secrets \
#     --namespace openclaw \
#     --from-literal=ANTHROPIC_API_KEY='sk-ant-YOUR_KEY_HERE' \
#     --from-literal=OPENCLAW_SECRET='your-random-secret-string'
#
# Access (LAN only):
#   Control UI: http://192.168.100.32
#   Gateway API: http://192.168.100.32:3001
# =============================================================================

---
apiVersion: v1
kind: Namespace
metadata:
  name: openclaw
  labels:
    app.kubernetes.io/name: openclaw
    access: internal-only
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config
  namespace: openclaw
data:
  # Model config — use Claude as the primary model
  DEFAULT_AI_PROVIDER: "anthropic"
  DEFAULT_MODEL: "claude-sonnet-4-6"
  FAST_MODEL: "claude-haiku-4-5-20251001"
  # Gateway network config
  GATEWAY_HOST: "0.0.0.0"
  GATEWAY_PORT: "3001"
  UI_PORT: "3000"
  # Workspace config
  WORKSPACE_DIR: "/data/workspace"
  LOGS_DIR: "/data/logs"
  PLUGINS_DIR: "/data/plugins"
  # Security
  TRUST_PROXY: "true"
  ALLOWED_ORIGINS: "*"   # Restrict to LAN CIDR if desired: 192.168.0.0/16
  # Agent behavior
  MAX_CONCURRENT_AGENTS: "5"
  AGENT_TIMEOUT_MS: "300000"   # 5 minutes
  ENABLE_PLUGIN_MARKETPLACE: "true"
  # Disable telemetry in self-hosted mode
  TELEMETRY_ENABLED: "false"
  ANALYTICS_ENABLED: "false"
  NODE_ENV: "production"
---
# PVC for OpenClaw persistent data (workspace, logs, plugins)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openclaw-data-pvc
  namespace: openclaw
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: local-path
---
# ---- OpenClaw Gateway + Control UI ----
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw
  namespace: openclaw
  labels:
    app: openclaw
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openclaw
  strategy:
    type: Recreate   # Recreate (not RollingUpdate) since it uses a single PVC
  template:
    metadata:
      labels:
        app: openclaw
    spec:
      # Pin to node1 (server node — most RAM)
      nodeSelector:
        kubernetes.io/hostname: node1

      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

      initContainers:
        # Install OpenClaw via npm on first run
        - name: install-openclaw
          image: node:20-slim
          command:
            - sh
            - -c
            - |
              set -e
              echo "Checking OpenClaw installation..."
              if [ ! -f /data/openclaw/.installed ]; then
                echo "Installing OpenClaw (first run)..."
                mkdir -p /data/openclaw
                cd /data/openclaw
                npm install --prefix . openclaw@latest 2>&1 | tail -20
                echo "$(date)" > /data/openclaw/.installed
                echo "OpenClaw installed."
              else
                echo "OpenClaw already installed. Checking for updates..."
                cd /data/openclaw
                npm update openclaw 2>&1 | tail -5 || true
              fi
              mkdir -p /data/workspace /data/logs /data/plugins
          volumeMounts:
            - name: data
              mountPath: /data

      containers:
        - name: openclaw
          image: node:20-slim
          command:
            - sh
            - -c
            - |
              cd /data/openclaw
              node node_modules/.bin/openclaw start \
                --host "${GATEWAY_HOST}" \
                --port "${GATEWAY_PORT}" \
                --ui-port "${UI_PORT}" \
                --workspace "${WORKSPACE_DIR}" \
                --model "${DEFAULT_MODEL}" \
                --provider "${DEFAULT_AI_PROVIDER}"
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: ANTHROPIC_API_KEY
            - name: OPENCLAW_SECRET
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: OPENCLAW_SECRET
          envFrom:
            - configMapRef:
                name: openclaw-config
          ports:
            - name: ui
              containerPort: 3000
            - name: gateway
              containerPort: 3001
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: "512Mi"
              cpu: "300m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 90
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 60
            periodSeconds: 15

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: openclaw-data-pvc
---
# ---- Service: expose UI + gateway on internal LAN ----
apiVersion: v1
kind: Service
metadata:
  name: openclaw
  namespace: openclaw
  labels:
    app: openclaw
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.100.32   # MetalLB — LAN accessible
  selector:
    app: openclaw
  ports:
    - name: ui
      port: 80
      targetPort: 3000
    - name: gateway
      port: 3001
      targetPort: 3001
---
# ---- NetworkPolicy: OpenClaw — internal LAN only ----
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openclaw-policy
  namespace: openclaw
spec:
  podSelector:
    matchLabels:
      app: openclaw
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 3001
  egress:
    # DNS
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Anthropic API + external HTTPS (model calls, plugin marketplace)
    - ports:
        - protocol: TCP
          port: 443
    # Allow talking to claude-agents service in same cluster
    - to:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/name: claude-agents
      ports:
        - protocol: TCP
          port: 3000
